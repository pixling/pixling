name: Bug report / 不具合
description: Report an app bug. / アプリの不具合を報告する。
title: '[Bug] '
type: Bug
body:
- type: markdown
  attributes:
    value: |-
      ### Privacy before posting / 投稿前の確認
      Screenshots and logs can expose resident or agent conversations, file names, and your Mac account name. Review all content and redact personal information, secrets, and unrelated conversations before posting.
      画面・ログには住人・エージェントの会話・ファイル名・Mac のアカウント名が写りうるため、投稿前にすべて確認し、個人情報・秘密・無関係な会話を伏せてください。

      Do not post billing, refund, transaction ID, or wallet details here. Email [support@pixling.app](mailto:support@pixling.app) instead. Report vulnerabilities privately, never in this form.
      課金・返金・取引 ID・財布の情報は公開の場に書かず、[support@pixling.app](mailto:support@pixling.app) にメールしてください。脆弱性は非公開で報告し、このフォームには書かないでください。

      Ideas and questions belong in [Discussions](https://github.com/pixling/pixling/discussions). Reports may be written in any language.
      要望と質問は [Discussions](https://github.com/pixling/pixling/discussions) へ。投稿はどの言語でもかまいません。
- type: dropdown
  id: area
  attributes:
    label: Area / 領域
    options:
    - Desk / 机
    - Studio / スタジオ
    - Create / つくる
    - Other or unsure / その他・不明
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Pixling version / Pixling の版
  validations:
    required: true
- type: input
  id: build
  attributes:
    label: Build / ビルド
  validations:
    required: false
- type: input
  id: commit
  attributes:
    label: App commit (if shown) / アプリの commit（表示される場合）
  validations:
    required: false
- type: input
  id: macos
  attributes:
    label: macOS version / macOS の版
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce / 再現手順
    description: Use a minimal example with no personal content. / 個人の情報を含まない最小限の例で説明してください。
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: What happened? / 実際に起きたこと
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect? / 期待した動き
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Reviewed screenshots or logs / 確認済みの画面・ログ
    description: Optional. Attach only relevant content after redaction. / 任意。伏せた後の、必要な内容だけを添付してください。
  validations:
    required: false
- type: checkboxes
  id: privacy-check
  attributes:
    label: Before submitting / 投稿前に
    options:
    - label: I reviewed and redacted the content; it contains no billing or transaction details. / 内容を確認して必要な情報を伏せ、課金・取引の情報を含めていません。
      required: true
