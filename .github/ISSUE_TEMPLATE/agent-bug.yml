name: Agent / CLI / MCP bug
description: Report a CLI or MCP integration bug.
title: '[Agent bug] '
type: Bug
body:
- type: markdown
  attributes:
    value: |-
      ### Privacy before posting
      Screenshots and logs can expose resident or agent conversations, file names, and your Mac account name. Review all content and redact personal information, secrets, and unrelated conversations before posting.

      Do not post billing, refund, transaction ID, or wallet details here. Email [support@pixling.app](mailto:support@pixling.app) instead. Report vulnerabilities privately, never in this form.

      Ideas and questions belong in [Discussions](https://github.com/pixling/pixling/discussions). English is appreciated, but Japanese and other languages are welcome.
- type: dropdown
  id: area
  attributes:
    label: Integration
    options:
    - CLI
    - MCP
    - CLI and MCP
    - Unsure
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Pixling version
  validations:
    required: true
- type: input
  id: build
  attributes:
    label: Build
  validations:
    required: false
- type: input
  id: commit
  attributes:
    label: App commit (if shown)
  validations:
    required: false
- type: input
  id: macos
  attributes:
    label: macOS version
  validations:
    required: true
- type: input
  id: host
  attributes:
    label: Agent host and version
  validations:
    required: true
- type: textarea
  id: doctor
  attributes:
    label: pixling doctor --json
    description: Run `pixling doctor --json`, review the entire output, and manually redact private content
      before pasting. Do not assume paths are anonymized. If the command fails, paste only the reviewed
      error.
    render: json
  validations:
    required: true
- type: textarea
  id: request
  attributes:
    label: Minimal command or tool call
    description: Include the tool name and redacted arguments, never secrets or conversation history.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Use a minimal example with no personal content.
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: What happened?
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: What did you expect?
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Reviewed screenshots or logs
    description: Optional. Attach only relevant content after redaction.
  validations:
    required: false
- type: checkboxes
  id: privacy-check
  attributes:
    label: Before submitting
    options:
    - label: I reviewed and redacted the content; it contains no billing or transaction details.
      required: true
