name: Documentation
description: Report a documentation error.
title: '[Docs] '
type: Docs
labels:
- area:docs
body:
- type: markdown
  attributes:
    value: |-
      ### Privacy before posting
      Screenshots and logs can expose resident or agent conversations, file names, and your Mac account name. Review all content and redact personal information, secrets, and unrelated conversations before posting.

      Do not post billing, refund, transaction ID, or wallet details here. Email [support@pixling.app](mailto:support@pixling.app) instead. Report vulnerabilities privately, never in this form.

      Ideas and questions belong in [Discussions](https://github.com/pixling/pixling/discussions). English is appreciated, but Japanese and other languages are welcome.
- type: input
  id: page-url
  attributes:
    label: Page URL
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Documentation or app version (if shown)
  validations:
    required: false
- type: input
  id: language
  attributes:
    label: Page language
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: What is incorrect or missing?
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested correction
    description: Optional. Explain what would help.
  validations:
    required: false
- type: checkboxes
  id: privacy-check
  attributes:
    label: Before submitting
    options:
    - label: I reviewed and redacted the content; it contains no billing or transaction details.
      required: true
